    by('assist').hidden=!world.ranks.orbit&&!world.ranks.lens&&!tide;by('assist').textContent=(world.momentum>.05?'◌ 余韻 '+world.momentum.toFixed(1)+'s':world.ranks.orbit?'◌ 余韻':'')+(world.ranks.lens?'　⊙ 引力':'')+(tide?'　◉ '+(world.time<world.tideUntil?'潮汐発動':tideReady?'潮汐 READY':'潮汐 '+Math.ceil(world.tideReady-world.time)+'s'):'');by('assist').dataset.active=String(world.momentum>.05||tide&&tideReady);
    by('build-strip').innerHTML=Object.entries(world.ranks).filter(([k,v])=>v).map(([k,v])=>'<span title="'+M.UPGRADES[k].name+' '+v+'">'+icons[k]+'<b>'+v+'</b></span>').join('')+(world.evolution?'<span class="evolution-chip">'+M.EVOLUTIONS[world.evolution].icon+' '+M.EVOLUTIONS[world.evolution].name+'</span>':'');
    canvas.setAttribute('aria-label','深度 '+world.sector+' '+world.phaseLabel+'。HP '+world.hp+'。エントロピー '+world.energy+'。レベル '+world.level+'。捕捉 '+world.tracked+'体。漂う光 '+world.available+'。'+(boss?'核HP '+boss.hp+'。':'')+title);
    by('test-state').textContent=JSON.stringify({version:M.VERSION,mode,qa,sector:world.sector,phase:world.phase,level:world.level,time:+world.time.toFixed(2),hp:world.hp,energy:world.energy,available:world.available,kills:world.kills,chain:world.bestChain,continues:world.continues,profileRuns:p.runs,crystals:p.crystals,bossHP:boss?.hp||0,bossKind:world.peak?.kind||null,evolution:world.evolution,bossOpen:world.peak?.kind==='iris'?world.irisState().open:null,momentum:+world.momentum.toFixed(2),pierced:world.pierced,build:world.ranks,frames:frameStats.frames,slowFrames:frameStats.slow,maxFrameMs:Math.round(frameStats.max*1000)});
  }
  function events(){
    for(const e of world.drain()){
      if(e.type==='evolution'){message='核の進化 · '+M.EVOLUTIONS[e.evolution].name;messageUntil=clock+3;}
      if(e.type==='echoHit'){message='反響 · 戻る光が命中';messageUntil=clock+1.4;}
      if(e.type==='tide'){message='潮汐 · 外側の光を引き込む';messageUntil=clock+1.3;}
      if(e.type==='firstLevel'){message='Lv.2 · 吸引力が20%高まった。';messageUntil=clock+3;}
      if(e.type==='chainComplete'&&e.hits>1){message=e.hits+'連鎖 · '+e.saved+' 節約';messageUntil=clock+2;}
      if(e.type==='empty'){message='エントロピー不足。光を回収しよう。';messageUntil=clock+2;}
      if(e.type==='guardBreak'){message='守りが崩れた。3.5秒間、威力2倍。';messageUntil=clock+3.5;}
      if(e.type==='impact'){message='中心に侵入された · HP −'+e.damage;messageUntil=clock+1.5;}
      if(e.type==='shield'){message=e.kind==='relay'?'結節を経由した光で、守りが開く。':'今は閉じている。開く瞬間へ光を届けよう。';messageUntil=clock+2;}
      if(e.type==='twinDown'){message='片方が沈黙。戻る前に、もう片方へ。';messageUntil=clock+2;}
      if(e.type==='twinRepair'){message='核が再生した。二つを続けて崩そう。';messageUntil=clock+2;}
      if(e.type==='pierced'){message='貫通 · 奥の敵へ届いた';messageUntil=clock+1.4;}
      if(e.type==='peakFailed'){by('stage-banner').innerHTML='<span>CORE BREACHED</span><small>防壁を越えられた。次の波に備える。</small>';by('stage-banner').dataset.kind='breached';by('stage-banner').classList.add('visible');by('stage-banner').setAttribute('aria-hidden','false');bannerUntil=clock+1.4;}
      if(e.type==='bossArrival'||e.type==='release'||e.type==='sector'){
        if(e.type==='bossArrival')by('stage-banner').style.setProperty('--arrival-y',world.boss?.y>0?'14%':'62%');
        const full=e.type==='release'&&e.full;
        const text=e.type==='bossArrival'?(M.BOSSES[e.kind]?.name||'核、接近。'):e.type==='release'?(full?'WAVE '+String(e.sector).padStart(2,'0')+' COMPLETE':'CORE BREAK'):'WAVE '+String(e.sector).padStart(2,'0');
        const sub=e.type==='bossArrival'?M.BOSSES[e.kind]?.clue:e.type==='release'?(full?'光を取り戻し、次の深度へ。':'次の核が、目を覚ます。'):e.name+(e.sector===3?' · 自動探知が起動':'');
        by('stage-banner').innerHTML='<span>'+text+'</span><small>'+sub+'</small>';by('stage-banner').dataset.kind=full?'complete':e.type;by('stage-banner').classList.add('visible');by('stage-banner').setAttribute('aria-hidden','false');bannerUntil=clock+(full?2.6:e.type==='bossArrival'?1.8:1.65);
      }
      if(['scan','escape','over','formation','choice','phase'].includes(e.type))continue;
      if(e.type==='capture'&&fx.filter(f=>f.type==='capture').length>7)continue;
      const duration=e.type==='release'?3:e.type==='nucleusCollapse'?1.8:e.type==='evolution'?2:e.type==='tide'?1.2:e.type==='sector'?2:e.type==='bossArrival'?1.8:e.type==='chainComplete'?1.6:e.type==='kill'?1.1:e.type==='fire'?.26:e.type==='groupLink'?.65:e.type==='impact'?.7:1;
      fx.push({...e,duration,life:duration});
    }
    if(fx.length>150)fx=fx.slice(-150);
  }
  function frame(now){
    const raw=last?(now-last)/1000:0,dt=Math.min(.05,raw);last=now;clock=now/1000;
    if(mode==='play'){
      if(world.started&&raw>0){frameStats.frames++;if(raw>.035)frameStats.slow++;frameStats.max=Math.max(frameStats.max,raw);}
      if(pilot){pilot.update(dt);world.demoPointer=pilot.pointer;}
      world.step(dt,pilot?pilot.input():gesture.read(clock));events();syncMode();
      checkpointTime+=dt;if(checkpointTime>=10){checkpointTime=0;checkpoint();}
    }
    if(mode==='choice'&&pilot){pilot.update(dt);if(pilot.choiceTime>1.6){world.choose(pilot.upgrade());resume();}}
    if(mode==='ad'&&ad&&!document.hidden){
      ad.remaining=Math.max(0,ad.remaining-dt);if(ad.remaining===0&&!ad.done){ad.done=true;const b=by('overlay').querySelector('[data-action="ad-complete"]');b.disabled=false;b.textContent='特典を受け取る';}
      by('ad-seconds').textContent=ad.done?'✓':Math.ceil(ad.remaining);
    }
    if(mode==='play'||mode==='home'||mode==='result'){
      for(const a of [traces,fx])for(const f of a)f.life-=dt;traces=traces.filter(f=>f.life>0);fx=fx.filter(f=>f.life>0);
    }
    if(clock>bannerUntil){by('stage-banner').classList.remove('visible');by('stage-banner').setAttribute('aria-hidden','true');}if(clock>toastUntil)by('toast').hidden=true;
    uiTime+=dt;if(uiTime>.1){uiTime=0;read();}art.render(world,gesture,fx,traces,clock);requestAnimationFrame(frame);
  }
  new ResizeObserver(resize).observe(canvas);resize();renderSheet();read();requestAnimationFrame(frame);
  const scene=params.get('qa');if(['growth','choice','peak','guard','maximum','split','loss','recovery','iris','relay','twins','penetration','assist','formations','tour','evolve_echo','evolve_tide','evolve_lance','evolution'].includes(scene))start(scene);
})();
</script>
