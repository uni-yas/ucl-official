<script>/* A deterministic art/game study of outward drift, not a thermodynamic model. */
(function(root,factory){const api=factory();if(typeof module==='object'&&module.exports)module.exports=api;else root.ThreadDrift=api;})(typeof globalThis!=='undefined'?globalThis:this,()=>{
  'use strict';
  const TAU=Math.PI*2,DURATION=24,TOTAL=300,COUNT=150;
  const kinds=[
    {id:'swift',name:'先に離れる',color:[236,223,193],speed:[.050,.068],curl:.035},
    {id:'wander',name:'揺らぎながら離れる',color:[151,219,211],speed:[.033,.047],curl:-.044},
    {id:'float',name:'ゆっくり漂う',color:[181,170,226],speed:[.022,.030],curl:.072}

        phase:random()*TAU,frequency:.47+random()*.33,curl:kind.curl*(.7+random()*.6),

    for(const p of particles){let a=0,b=60;for(let i=0;i<40;i++){const m=(a+b)/2;if(at(p,m).radius<1)a=m;else b=m;}p.escapeAt=(a+b)/2;}

});

(function(root,factory){const api=factory(typeof module==='object'&&module.exports?require('./entropy.js'):root.ThreadDrift);if(typeof module==='object'&&module.exports)module.exports=api;else root.ThreadFlow=api;})(typeof globalThis!=='undefined'?globalThis:this,D=>{
  'use strict';

  const kinds=[
    {id:'swift',name:'逃げ足が速い',color:[236,223,193],drift:1.2,response:1.05,inertia:.16},
    {id:'ribbon',name:'流れに乗る',color:[151,219,211],drift:1,response:1.48,inertia:.23},

    if(world.phase==='release'){title='解放。すべての光を、取り戻す。';sub='ぐるぐるで回収 · 次の深度へつながる。';}
    by('status').dataset.mode=selecting?'chain':'idle';by('status').dataset.group=String(q.groupSavings>0);say(title,sub);
    const boss=world.boss;by('boss-hint').hidden=!boss;by('boss-hint').textContent=boss?(boss.kind==='guard'?(world.peak?.guards.some(id=>world.enemies.some(e=>e.id===id))?'護衛をつないで、核の守りを崩す':world.peak?.breakAt!==null&&world.time-world.peak.breakAt<3.5?'守りが崩れた · 今は威力2倍':'守りのない核へ、追撃'):'核が分裂する · 次の光を残しておく'):'';
    canvas.setAttribute('aria-label','深度 '+world.sector+' '+world.phaseLabel+'。HP '+world.hp+'。エントロピー '+world.energy+'。レベル '+world.level+'。捕捉 '+world.tracked+'体。漂う光 '+world.available+'。'+(boss?'核HP '+boss.hp+'。':'')+title);
    by('test-state').textContent=JSON.stringify({version:M.VERSION,mode,qa,sector:world.sector,phase:world.phase,level:world.level,time:+world.time.toFixed(2),hp:world.hp,energy:world.energy,available:world.available,kills:world.kills,chain:world.bestChain,continues:world.continues,profileRuns:p.runs,crystals:p.crystals,bossHP:boss?.hp||0,slowFrames:frameStats.slow});
  }
  function events(){
    for(const e of world.drain()){
      if(e.type==='firstLevel'){message='Lv.2 · 吸引力が20%高まった。';messageUntil=clock+3;}
      if(e.type==='chainComplete'&&e.hits>1){message=e.hits+'連鎖 · '+e.saved+' 節約';messageUntil=clock+2;}
      if(e.type==='empty'){message='エントロピー不足。光を回収しよう。';messageUntil=clock+2;}
      if(e.type==='guardBreak'){message='守りが崩れた。3.5秒間、威力2倍。';messageUntil=clock+3.5;}
      if(e.type==='impact'){message='中心に侵入された · HP −'+e.damage;messageUntil=clock+1.5;}
      if(e.type==='bossArrival'||e.type==='release'||e.type==='sector'){
        let text=e.type==='bossArrival'?'核、接近。':e.type==='release'?'R E L E A S E':'深度 '+String(e.sector).padStart(2,'0');
        let sub=e.type==='bossArrival'?({guard:'護衛から崩す',split:'分裂の先を見極める',wedge:'高速編隊をつなぐ',cross:'交差する護衛編隊'}[e.kind]):e.type==='release'?(e.full?'すべての光が、還る。':'まだ、次の核が来る。'):e.name+(e.sector===3?' · 自動探知が起動':'');
        by('stage-banner').innerHTML=text+'<small>'+sub+'</small>';by('stage-banner').classList.add('visible');by('stage-banner').setAttribute('aria-hidden','false');bannerUntil=clock+2.5;
      }
      if(['scan','escape','over','formation','choice','phase'].includes(e.type))continue;
      if(e.type==='capture'&&fx.filter(f=>f.type==='capture').length>7)continue;
      const duration=e.type==='release'?3:e.type==='chainComplete'?1.6:e.type==='kill'?1.1:e.type==='fire'?.26:e.type==='groupLink'?.65:e.type==='impact'?.7:1;
      fx.push({...e,duration,life:duration});
    }
    if(fx.length>150)fx=fx.slice(-150);
  }
  function frame(now){
    const raw=last?(now-last)/1000:0,dt=Math.min(.05,raw);last=now;clock=now/1000;
    if(mode==='play'){
      if(world.started&&raw>0){frameStats.frames++;if(raw>.035)frameStats.slow++;frameStats.max=Math.max(frameStats.max,raw);}
      world.step(dt,gesture.read(clock));events();syncMode();
      checkpointTime+=dt;if(checkpointTime>=10){checkpointTime=0;checkpoint();}
    }
    if(mode==='ad'&&ad&&!document.hidden){
      ad.remaining=Math.max(0,ad.remaining-dt);if(ad.remaining===0&&!ad.done){ad.done=true;const b=by('overlay').querySelector('[data-action="ad-complete"]');b.disabled=false;b.textContent='特典を受け取る';}
      by('ad-seconds').textContent=ad.done?'✓':Math.ceil(ad.remaining);
    }
    if(mode==='play'||mode==='home'||mode==='result'){
      for(const a of [traces,fx])for(const f of a)f.life-=dt;traces=traces.filter(f=>f.life>0);fx=fx.filter(f=>f.life>0);
    }
    if(clock>bannerUntil){by('stage-banner').classList.remove('visible');by('stage-banner').setAttribute('aria-hidden','true');}if(clock>toastUntil)by('toast').hidden=true;
    uiTime+=dt;if(uiTime>.1){uiTime=0;read();}art.render(world,gesture,fx,traces,clock);requestAnimationFrame(frame);
  }
  new ResizeObserver(resize).observe(canvas);resize();renderSheet();read();requestAnimationFrame(frame);
  const scene=params.get('qa');if(['growth','choice','peak','guard','maximum','split','loss','recovery'].includes(scene))start(scene);
})();
</script>
